<div class="container mt-4">
    <h2 class="mb-4">Equipos</h2>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" *ngFor="let equipo of equipos">
            <div class="card h-100 shadow-sm">
                <img [src]="equipo.imagen" [alt]="equipo.nombre" class="card-img-top" style="height: 200px; object-fit: cover;">
                
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ equipo.nombre }}</h5>

                    <div class="d-flex gap-2 mb-2">
                        @if (equipo.champions > 0) {
                            <span class="badge bg-warning text-dark">
                                🏆 {{ equipo.champions }} Champions
                            </span>
                        }

                        @if (equipo.finalista > 0) {
                            <span class="badge bg-secondary">
                            🥈 {{ equipo.finalista }} Finalista
                            </span>
                        }

                    </div>
                    <a [href]="equipo.web" target="_blank" class="btn btn-outline-primary btn-sm mt-auto">
                        Ver web
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
